<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Books - BookShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="/stylesheets/style.css">
  <script src="/javascripts/utils.js"></script>
  <script src="/javascripts/identity.js"></script>
  <script src="/javascripts/index.js"></script>
</head>

<body data-page="library">
  <div class="page-shell">
    <nav class="topbar">
      <div class="topbar-inner">
        <div class="brand-lockup">
          <a href="/" class="brand-mark" aria-label="BookShare home">B</a>
          <div class="brand-text">
            <a href="/" class="brand-name">BookShare</a>
            <span class="brand-subtitle">The full shared library</span>
          </div>
        </div>

        <div class="nav-links">
          <a href="/" class="nav-link-pill">Discover</a>
          <a href="/all-books.html" class="nav-link-pill active">All Books</a>
          <a href="/groups.html" id="groups_nav_link" class="nav-link-pill nav-link-signed-in-only">Groups</a>
          <a href="/profile.html" class="nav-link-pill">My Profile</a>
        </div>

        <div id="identity_div">loading.</div>
      </div>
      <div
        id="errorInfo"
        class="alert alert-danger fade show mt-3"
        role="alert"
        style="opacity:0"
      ></div>
    </nav>

    <main>
      <section class="section-card library-page-card">
        <div class="section-head">
          <div>
            <span class="badge-soft">Shared Library</span>
            <h1 class="section-title mt-3">All books on BookShare</h1>
            <p class="section-subtitle">Browse the full library, or search by title or author to narrow it down.</p>
          </div>
          <a href="/" class="btn btn-outline-secondary">Back to Discover</a>
        </div>

        <div class="search-bar homepage-search-bar">
          <input
            id="book_search_input"
            type="text"
            class="form-control"
            placeholder="Search by title or author"
          />
          <button
            id="search_books_button"
            class="btn btn-primary"
            onclick="searchBooks()"
          >
            Search
          </button>
        </div>

        <div id="search_results">
          <!-- full book results go here -->
        </div>
      </section>
    </main>
  </div>
</body>
</html>
