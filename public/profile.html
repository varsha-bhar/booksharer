<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile – BookShare</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/stylesheets/style.css" />

    <script src="/javascripts/utils.js"></script>
    <script src="/javascripts/identity.js"></script>
    <script src="/javascripts/profile.js"></script>
    <script src="/javascripts/friends.js"></script>
  </head>

  <body onload="initProfilePage()">
    <nav class="navbar navbar-light bg-light px-3">
      <div
        id="errorInfo"
        class="alert alert-danger fade show mb-0"
        role="alert"
        style="opacity:0"
      ></div>

      <div><a href="/">Return to BookShare</a></div>

      <div id="identity_div">loading.</div>
    </nav>

    <main class="container my-4">
      <header class="mb-4">
        <h1>My Profile</h1>
        <p class="text-muted" id="profile_username"></p>
      </header>

      <!-- BOOKS USER HAS POSTED -->
      <section class="mb-5">
        <h2>Books I’ve Posted</h2>
        <div id="profile_books" class="mt-2">
          Loading…
        </div>
      </section>

      <!-- REVIEWS USER HAS POSTED -->
      <section class="mb-5">
        <h2>Reviews I’ve Written</h2>
        <div id="profile_reviews" class="mt-2">
          Loading…
        </div>
      </section>

      <!-- READING LIST -->
      <section class="mb-5">
        <h2>My Reading List</h2>
        <div id="profile_reading_list" class="mt-2">
          Loading…
        </div>
      </section>

      <!-- TAGGED BOOKS – PLACEHOLDER -->
      <section class="mb-5">
        <h2>Tagged For Me</h2>
        <div id="tagged_books_box" class="mt-2 text-muted">
          Loading…
        </div>
      </section>

      <!-- FRIEND LIST – PLACEHOLDER -->
      <section class="mb-5">
        <h2>My Friend Lists</h2>
        <div id="profile_friends" class="mt-2 text-muted">
          Friend list features coming soon.
        </div>
      </section>
    </main>
  </body>
</html>
