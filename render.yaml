services:
  - type: web
    name: booksharer
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CLIENT_ID
        sync: false
      - key: AUTHORITY
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        value: /redirect
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_BOOKS_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
